[workspace]
members = ["crates/core", "crates/application", "crates/server", "crates/cli", "crates/launcher"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/zhefox/TRANSPLANE-COMPANY"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "any", "sqlite-bundled", "postgres"], default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "set-header"] }
rust-embed = "8"
mime_guess = "2"
tempfile = "3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false

