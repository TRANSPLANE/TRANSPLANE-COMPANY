[package]
license.workspace = true
repository.workspace = true
name = "company-cli"
version.workspace = true
edition = "2021"

[[bin]]
name = "company"
path = "src/main.rs"

[dependencies]
company-application = { path = "../application" }
company-core = { path = "../core" }
company-server = { path = "../server" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
